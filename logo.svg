  </linearGradient>
  <linearGradient id="sfInner" gradientUnits="userSpaceOnUse" x1="140" y1="108" x2="372" y2="356">
    <stop offset="0" stop-color="#2A3280"/><stop offset=".55" stop-color="#1A2060"/><stop offset="1" stop-color="#0E1338"/>
  </linearGradient>
  <linearGradient id="sfInnerKey" gradientUnits="userSpaceOnUse" x1="140" y1="108" x2="372" y2="356">
    <stop offset="0" stop-color="#7C86F5"/><stop offset="1" stop-color="#2E3690"/>
  </linearGradient>
  <linearGradient id="sfBar" x1="0" y1="0" x2="0" y2="1">
