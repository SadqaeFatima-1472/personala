<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 4 416 496" fill="none" role="img" aria-label="Strataforge3 mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Strataforge3 mark</title>
<style>
  .sf-bar{transform-box:fill-box;transform-origin:50% 100%;animation:sf-rise 1.1s cubic-bezier(.2,.9,.25,1) both}
  .sf-b2{animation-delay:.12s}.sf-b3{animation-delay:.24s}
  .sf-ember{transform-box:fill-box;transform-origin:center;animation:sf-pop .6s .95s both,sf-glint 3.4s 1.8s ease-in-out infinite}
  .sf-sheen{animation:sf-sweep 8s 2s ease-in-out infinite}
  @keyframes sf-rise{from{transform:scaleY(.12);opacity:0}to{transform:scaleY(1);opacity:1}}
  @keyframes sf-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes sf-glint{0%,100%{opacity:.7;transform:scale(.88)}50%{opacity:1;transform:scale(1.14)}}
  @keyframes sf-sweep{0%{transform:translateX(-200px)}40%,100%{transform:translateX(560px)}}
  @media (prefers-reduced-motion:reduce){.sf-bar,.sf-ember,.sf-sheen{animation:none}}
</style>
