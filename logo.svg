  </radialGradient>
  <radialGradient id="sfEmber" gradientUnits="userSpaceOnUse" cx="306" cy="166" r="26">
    <stop offset="0" stop-color="#FFC878" stop-opacity=".9"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
