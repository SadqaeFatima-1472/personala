<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">PAYESH experimental logo</title>
  <desc id="desc">A glowing copper and amber ribbon emblem above PAYESH, Persian پایش, and the tagline Monitoring Builds a Safer Tomorrow.</desc>
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd4a"/><stop offset=".24" stop-color="#ff6a16"/><stop offset=".53" stop-color="#d83b18"/><stop offset=".76" stop-color="#ff8b22"/><stop offset="1" stop-color="#762013"/>
    </linearGradient>
    <linearGradient id="ribbonLight" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#ffd36a"/><stop offset=".45" stop-color="#ff781c"/><stop offset="1" stop-color="#a62618"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7df"/><stop offset=".55" stop-color="#e8d9b5"/><stop offset="1" stop-color="#bca77c"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e83d1a"/><stop offset=".5" stop-color="#ffbd32"/><stop offset="1" stop-color="#e83d1a"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#ff6a17" stop-opacity=".2"/><stop offset="1" stop-color="#ff4b10" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grainGrid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d46b35" stroke-opacity=".035" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="1200" fill="#080808"/>
  <rect width="1200" height="1200" fill="url(#grainGrid)"/>
  <ellipse cx="600" cy="420" rx="300" ry="300" fill="url(#halo)"/>
  <!-- Interwoven continuous ribbon mark, constructed from editable vector paths -->
  <g transform="translate(0,-8)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M478 304 C478 260 512 231 559 220 C615 207 674 226 716 258 C761 292 791 331 795 373 C799 416 772 447 735 474 L650 536 C620 557 598 579 598 612 L598 686 C598 707 610 715 630 703 C673 678 704 648 706 614 C709 579 687 559 655 539 L513 449 C476 426 458 398 461 365 C463 341 469 322 478 304Z" fill="url(#ribbon)" opacity=".98"/>
    <path d="M559 220 C532 249 527 280 528 317 L528 423 C528 458 548 481 578 501 L690 576 C713 592 719 614 706 638 C692 663 662 687 630 703 C650 678 655 655 650 632 C646 611 627 594 604 579 L495 509 C461 487 442 458 442 423 L442 362 C442 326 460 298 493 278Z" fill="url(#ribbonLight)"/>
    <path d="M478 304 C478 260 512 231 559 220 C615 207 674 226 716 258 C761 292 791 331 795 373 C799 416 772 447 735 474 L650 536 C620 557 598 579 598 612 L598 686" fill="none" stroke="#ffb74a" stroke-opacity=".7" stroke-width="2"/>
    <path d="M559 220 C532 249 527 280 528 317 L528 423 C528 458 548 481 578 501 L690 576 C713 592 719 614 706 638" fill="none" stroke="#ffb03b" stroke-opacity=".65" stroke-width="2"/>
    <path d="M601 390 L601 390" stroke="#ff8a20" stroke-width="2"/>
    <circle cx="610" cy="390" r="35" fill="#ff6a12" opacity=".35" filter="url(#softGlow)"/>
    <circle cx="610" cy="390" r="15" fill="#ffb82e" filter="url(#glow)"/>
    <path d="M625 390 H897" stroke="url(#scan)" stroke-width="3" filter="url(#glow)"/>
    <path d="M897 390 H955" stroke="#f05a1b" stroke-opacity=".25" stroke-width="1.5"/>
  </g>
  <text x="600" y="817" text-anchor="middle" font-family="Montserrat, Avenir Next, Arial, sans-serif" font-size="93" font-weight="500" letter-spacing="18" fill="url(#type)">PAYESH</text>
  <!-- Custom E accent echoes the signal pulse -->
  <path d="M661 790 H703 M661 807 H693" stroke="#ff7620" stroke-width="4"/>
  <g fill="url(#type)" font-family="Noto Sans Arabic, Noto Naskh Arabic, Amiri, serif" font-size="58" text-anchor="middle">
    <text x="600" y="901" direction="rtl" unicode-bidi="bidi-override">پایش</text>
  </g>
  <path d="M352 884 H475" stroke="url(#scan)" stroke-width="2.5"/><path d="M725 884 H848" stroke="url(#scan)" stroke-width="2.5"/>
  <text x="600" y="986" text-anchor="middle" font-family="Montserrat, Avenir Next, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="9" fill="#d6cbb6">MONITORING BUILDS A SAFER TOMORROW</text>
</svg>
