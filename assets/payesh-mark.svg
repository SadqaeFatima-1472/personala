<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="PAYESH mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>PAYESH mark</title>
<style>
  .py-draw{animation:py-draw 5s ease-in-out infinite}
  .py-ping{opacity:0;transform-box:fill-box;transform-origin:center;animation:py-ping 2.6s ease-out infinite}
  .py-orbit{transform-box:fill-box;transform-origin:center;animation:py-spin 40s linear infinite}
  .py-breathe{animation:py-breathe 2.6s ease-in-out infinite}
  @keyframes py-draw{0%{stroke-dasharray:100 100;stroke-dashoffset:100;opacity:1}38%{stroke-dasharray:100 100;stroke-dashoffset:0;opacity:1}88%{stroke-dasharray:100 100;stroke-dashoffset:0;opacity:1}100%{stroke-dasharray:100 100;stroke-dashoffset:0;opacity:0}}
  @keyframes py-ping{0%{transform:scale(.9);opacity:.85}100%{transform:scale(3.2);opacity:0}}
  @keyframes py-spin{to{transform:rotate(360deg)}}
  @keyframes py-breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.py-draw,.py-ping,.py-orbit,.py-breathe{animation:none}}
</style>
