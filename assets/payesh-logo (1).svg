<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" role="img" aria-label="Payesh logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Payesh – Monitoring builds a safer tomorrow</title>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0" stop-color="#3a1204" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gStem" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#d7300f"/>
    </linearGradient>
    <linearGradient id="gLoop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8741c"/>
      <stop offset="0.6" stop-color="#d8420f"/>
      <stop offset="1" stop-color="#ff9a2e"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffa63a"/>
      <stop offset="0.5" stop-color="#e2631a"/>
      <stop offset="1" stop-color="#c22a0c"/>
    </linearGradient>
    <linearGradient id="gDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a24"/>
      <stop offset="0.55" stop-color="#e5461a"/>
      <stop offset="1" stop-color="#8f1a08"/>
    </linearGradient>
    <linearGradient id="gBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa22e"/>
      <stop offset="1" stop-color="#b8240a"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4a1a"/>
      <stop offset="1" stop-color="#ff4a1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </radialGradient>
    <linearGradient id="eBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1a"/>
      <stop offset="1" stop-color="#ffd0a0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="edgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1254" height="1254" fill="#000"/>
  <rect width="1254" height="1254" fill="url(#bgGlow)"/>

  <!-- ===== EMBLEM ===== -->
  <g filter="url(#glow)" opacity="0.9">
    <!-- Left sweeping band -->
    <path d="M405 378 C432 342 462 326 490 314 L492 432 C430 470 440 590 500 746
             C470 700 408 560 405 378 Z" fill="url(#gLeft)"/>

    <!-- Stem + top loop (outer ribbon) -->
    <path d="M487 305 C487 262 520 241 562 240
             C655 238 765 282 812 332 C842 364 838 396 820 412
             C770 470 700 490 636 502
             L562 440 C640 420 722 400 752 372
             C768 350 740 310 690 288 C640 266 590 262 562 272
             L556 700 C556 740 520 765 500 745 L498 640 Z"
          fill="url(#gStem)"/>

    <!-- Loop underside (lighter translucent band) -->
    <path d="M820 412 C770 470 700 490 636 502 L690 548 C760 500 810 462 826 428 Z"
          fill="url(#gLoop)" opacity="0.85"/>

    <!-- Diagonal crossing band -->
    <path d="M492 432 C560 470 650 518 700 560 C745 600 728 656 690 694
             C650 734 585 760 522 766 C503 766 494 756 500 745
             C540 740 640 700 670 640 C690 600 600 540 492 470 Z"
          fill="url(#gDiag)"/>

    <!-- Bottom bowl highlight -->
    <path d="M500 745 C540 738 640 700 672 640 C700 700 600 756 522 766
             C504 766 494 757 500 745 Z" fill="url(#gBottom)" opacity="0.9"/>
  </g>

  <!-- Ribbon edge highlights -->
  <g fill="none" stroke-linecap="round" filter="url(#edgeGlow)">
    <path d="M487 305 C487 262 520 241 562 240 C655 238 765 282 812 332 C842 364 838 396 820 412"
          stroke="#ffc15a" stroke-width="2.5" opacity="0.95"/>
    <path d="M820 412 C770 470 700 490 636 502" stroke="#ffb040" stroke-width="2" opacity="0.8"/>
    <path d="M562 272 C590 262 640 266 690 288 C740 310 768 350 752 372"
          stroke="#ff8a30" stroke-width="2" opacity="0.7"/>
    <path d="M405 378 C432 342 462 326 490 314" stroke="#ffd27a" stroke-width="2.5" opacity="0.95"/>
    <path d="M405 378 C408 560 470 700 500 746" stroke="#ffb040" stroke-width="2" opacity="0.7"/>
    <path d="M492 432 C560 470 650 518 700 560 C745 600 728 656 690 694 C650 734 585 760 522 766"
          stroke="#ff8a30" stroke-width="2" opacity="0.75"/>
    <path d="M556 272 L556 700" stroke="#ffd08a" stroke-width="1.5" opacity="0.5"/>
    <path d="M500 746 C490 770 495 780 500 790" stroke="#ff6a1a" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- Eye / monitoring orb with beam -->
  <rect x="650" y="405" width="375" height="3" fill="url(#beam)" opacity="0.9"/>
  <rect x="650" y="406" width="375" height="1" fill="#fff0c8" opacity="0.8"/>
  <circle cx="636" cy="407" r="30" fill="#ff8a1a" opacity="0.55" filter="url(#softGlow)"/>
  <circle cx="636" cy="407" r="17" fill="url(#orb)"/>

  <!-- ===== WORDMARK: PAYESH ===== -->
  <g fill="none" stroke="#fbf0e4" stroke-width="17" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- P -->
    <path d="M254 880 V806 H318 Q338 806 338 826 Q338 846 318 846 H254"/>
    <!-- A -->
    <path d="M384 880 L427 806 L470 880" stroke-linejoin="miter"/>
    <!-- Y -->
    <path d="M518 806 L564 852 L610 806 M564 852 V880"/>
    <!-- S -->
    <path d="M872 811 H802 Q782 811 782 829 Q782 845 802 845 H848 Q868 845 868 862 Q868 879 848 879 H776"/>
    <!-- H -->
    <path d="M938 806 V880 M1006 806 V880 M938 843 H1006"/>
  </g>
  <!-- stylised E (three bars with glowing middle) -->
  <g stroke-width="15" stroke-linecap="butt" fill="none">
    <path d="M666 808 H733" stroke="#fbf0e4"/>
    <path d="M684 843 H733" stroke="url(#eBar)"/>
    <path d="M666 878 H733" stroke="#fbf0e4"/>
    <path d="M733 806 V880" stroke="#fbf0e4" stroke-width="0"/>
  </g>
  <path d="M666 808 H733 M684 843 H733 M666 878 H733" fill="none" stroke="none"/>

  <!-- ===== Persian name + dividers ===== -->
  <rect x="370" y="944" width="123" height="2.5" fill="url(#lineL)"/>
  <rect x="765" y="944" width="123" height="2.5" fill="url(#lineR)"/>
  <text x="629" y="965" text-anchor="middle" font-size="58" fill="#fbf0e4"
        font-family="Vazirmatn, 'Noto Naskh Arabic', 'Noto Sans Arabic', Tahoma, 'Segoe UI', Arial, sans-serif"
        direction="rtl" unicode-bidi="plaintext">پایش</text>

  <!-- ===== Tagline ===== -->
  <text x="629" y="1036" text-anchor="middle" font-size="15" fill="#cfc4b8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        letter-spacing="7.5" xml:space="preserve">MONITORING  BUILDS A  SAFER  TOMORROW</text>
</svg>
